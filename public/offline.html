<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sin conexión · La agendita</title>
<style>
:root{color-scheme:light dark;--bg:#f3ede2;--card:#fbf8f2;--ink:#2b2520;--sub:#6f655a;--acc:#b4472e}

</style></head><body><div class="c">
<img src="/laagendita-icon.svg" alt="">
